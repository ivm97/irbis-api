# REST-шлюз к IRBIS64. Сами файлы БД (.mst/.xrf/…) не монтируются —
# нужен доступ по сети к серверу IRBIS (IRBIS_ADDR=host:6666).

services:
  irbis-api:
    build:
      context: .
      dockerfile: Dockerfile
      # локальный replace github.com/ivm97/GoIrbis => ../GoIrbis
      additional_contexts:
        goirbis: ../GoIrbis
    image: irbis-api:local
    ports:
      - "${HTTP_PORT:-8080}:8080"
    # скопируйте .env.example → .env и поправьте IRBIS_ADDR / AUTH_USERS
    # env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      # IRBIS на хосте (Linux). Для IRBIS в другой машине ЛС — IP:порт, напр. 192.168.1.10:6666
      IRBIS_ADDR: "${IRBIS_ADDR:-host.docker.internal:6666}"
      IRBIS_WORKSTATION: "${IRBIS_WORKSTATION:-C}"
      IRBIS_DEFAULT_DATABASE: "${IRBIS_DEFAULT_DATABASE:-IBIS}"
      IRBIS_USE_REQUEST_CREDENTIALS: "${IRBIS_USE_REQUEST_CREDENTIALS:-true}"
      AUTH_ALLOW_PLAINTEXT: "${AUTH_ALLOW_PLAINTEXT:-true}"
      # переопределите в .env; без AUTH_USERS / AUTH_USERS_FILE процесс не стартует
      AUTH_USERS: "${AUTH_USERS:-librarian|secret|IBIS=read,write&RDR=read||reader|reader|IBIS=read}"
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:-}"
      TEMPLATES_DIR: /app/templates
    volumes:
      # шаблоны печати (опционально — в образе уже есть ./templates)
      - ./templates:/app/templates:ro
      # раскомментируйте, если пользователи в файле:
      # - ./users.txt:/app/users.txt:ro
    # environment:
    #   AUTH_USERS_FILE: /app/users.txt
    extra_hosts:
      # host.docker.internal → хост-машина (нужно на Linux)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
