# Local API authorization file (not the IRBIS client_m.mnu itself).
# Access is checked here BEFORE any IRBIS call.
#
# permissions per database:
#   read  - search / get / terms / count
#   write - create / update / delete / batch

users:
  - username: librarian
    password: secret
    databases:
      IBIS:
        - read
        - write
      RDR:
        - read

  - username: reader
    password: reader
    databases:
      IBIS:
        - read

  # Production-style entry (generate hash):
  #   go run ./cmd/hashpwd secret
  # - username: admin
  #   password_hash: "$2a$10$...."
  #   databases:
  #     IBIS: [read, write]
